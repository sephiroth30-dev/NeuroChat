name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - 'releases/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar y publicar (ej: 2.2.2)'
        required: true
        default: '2.2.2'

permissions:
  contents: write

jobs:
  # ── 1. Crear draft release ─────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.ref_name }}"
            VERSION="${BRANCH#releases/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Crear draft release (idempotente)
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" \
              --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ya existe, se reutilizará."
          else
            gh release create "v${{ steps.ver.outputs.version }}" \
              --repo "${{ github.repository }}" \
              --title "NeuroChat v${{ steps.ver.outputs.version }}" \
              --generate-notes \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build Windows ────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar módulos nativos para Electron (Windows x64)
        run: npx @electron/rebuild -f -w better-sqlite3,robotjs

      - name: Build Windows NSIS
        run: npx electron-builder --win --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3a. Build macOS Intel x64 — runner nativo Intel ────────────────────────
  build-macos-x64:
    needs: create-release
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar better-sqlite3 para Electron x64 (nativo Intel)
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build macOS x64 DMG + ZIP
        run: npx electron-builder --mac --arch x64 --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3b. Build macOS Apple Silicon arm64 — runner nativo arm64 ──────────────
  build-macos-arm64:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar better-sqlite3 para Electron arm64 (nativo Apple Silicon)
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build macOS arm64 DMG + ZIP
        run: npx electron-builder --mac --arch arm64 --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Publicar release ─────────────────────────────────────────────────────
  publish-release:
    needs: [create-release, build-windows, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release (quitar borrador)
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
