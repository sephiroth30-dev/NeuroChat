name: Build & Release

# Dispara con:
#  a) push de tag  v*.*.* (ej: git tag v2.2.2 && git push origin v2.2.2)
#  b) push de branch releases/** (ej: git push origin main:releases/v2.2.2)
#  c) manualmente desde la UI de GitHub Actions → "Run workflow"
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - 'releases/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar y publicar (ej: 2.2.2)'
        required: true
        default: '2.2.2'

permissions:
  contents: write   # necesario para crear releases y subir assets

jobs:
  # ── 1. Crear draft release en GitHub antes de que los builds suban assets ──
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versión (tag, branch releases/** o input manual)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          else
            # Branch releases/v2.2.2 → extrae 2.2.2
            BRANCH="${{ github.ref_name }}"
            VERSION="${BRANCH#releases/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Crear draft release (idempotente)
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" \
              --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} ya existe, se reutilizará."
          else
            gh release create "v${{ steps.ver.outputs.version }}" \
              --repo "${{ github.repository }}" \
              --title "NeuroChat v${{ steps.ver.outputs.version }}" \
              --generate-notes \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build Windows (.exe NSIS installer + latest.yml) ───────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar módulos nativos para Electron (Windows x64)
        run: npx @electron/rebuild -f -w better-sqlite3,robotjs

      - name: Build Windows NSIS + publicar en release draft
        run: npx electron-builder --win --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build macOS universal (.dmg + .zip — Intel x64 + Apple Silicon arm64)
  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar módulos nativos para Electron (macOS — better-sqlite3)
        # robotjs está en optionalDependencies; si falla en macOS no es fatal
        # (Mac solo actúa como viewer, nunca como host de input)
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build macOS universal DMG + ZIP + publicar en release draft
        # electron-builder reconstruye internamente para x64 y arm64 al
        # detectar arch: universal en electron-builder.yml
        run: npx electron-builder --mac --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Publicar release (quitar borrador) cuando ambos builds terminen ────
  publish-release:
    needs: [create-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release (quitar borrador)
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
