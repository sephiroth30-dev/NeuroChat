name: Build & Release

# ──────────────────────────────────────────────────────────────────────────────
# FLUJO PERMANENTE — CÓMO PUBLICAR UNA NUEVA VERSIÓN:
#
#   1. Edita package.json: cambia "version" a la nueva versión
#   2. git add package.json && git commit -m "..." && git push origin main
#   3. Este workflow detecta que el tag no existe → build automático
#   4. Crea tag git + draft release, compila Win+Mac, publica
#   5. electron-updater entrega la actualización a todos los usuarios
#
# No se necesita crear ramas releases/vX.Y.Z ni hacer nada más.
# workflow_dispatch sirve para forzar un rebuild manual si algo falla.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - 'releases/**'     # backup: rama de release manual
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (vacío = leer de package.json)'
        required: false

permissions:
  contents: write

jobs:
  # ── 1. Crear tag git + draft release ────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver versión
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Decidir si hay que compilar
        id: check
        run: |
          VERSION="v${{ steps.ver.outputs.version }}"
          # workflow_dispatch fuerza siempre el build (para rebuildear si falló)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Build forzado por workflow_dispatch."
          # Push a main o releases/**: solo compilar si el tag aún no existe
          elif git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Tag $VERSION ya existe — nada que compilar."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION no existe → arrancando build."
          fi

      - name: Crear tag git
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="v${{ steps.ver.outputs.version }}"
          if ! git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Tag $VERSION creado."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear draft release (idempotente)
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="v${{ steps.ver.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $VERSION ya existe, se reutilizará."
          else
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "NeuroChat $VERSION" \
              --generate-notes \
              --draft \
            || gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "NeuroChat $VERSION" \
              --notes "Release $VERSION" \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build Windows ────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    if: needs.create-release.outputs.skip == 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar módulos nativos para Electron (Windows x64)
        run: npx @electron/rebuild -f -w better-sqlite3,robotjs

      - name: Build Windows NSIS
        # --publish always: sube al draft release independientemente de si es
        # un push de tag o de rama — soluciona el fallo histórico con onTagOrDraft
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build macOS universal (Intel + Apple Silicon) ────────────────────────
  #
  # electron-builder arch:universal falla con módulos nativos en runners arm64.
  # Solución manual: compilar arm64 nativo, cross-compilar x64 con CFLAGS,
  # unir con lipo, y npmRebuild:false en electron-builder.yml para que no
  # sobreescriba el fat binary durante el empaquetado.
  build-macos:
    needs: create-release
    if: needs.create-release.outputs.skip == 'false'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar better-sqlite3 para arm64 (nativo)
        run: |
          npx @electron/rebuild -f -w better-sqlite3 --arch=arm64
          echo "→ arch arm64:"
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node /tmp/bs3_arm64.node

      - name: Cross-compilar better-sqlite3 para x64
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
          CFLAGS: "-arch x86_64"
          CXXFLAGS: "-arch x86_64"
          LDFLAGS: "-arch x86_64"
        run: |
          npx @electron/rebuild -f -w better-sqlite3 --arch=x64
          echo "→ arch x64:"
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node | grep -q x86_64 || \
            { echo "ERROR: cross-compile x64 falló — sigue siendo arm64"; exit 1; }

      - name: Crear fat binary universal con lipo
        run: |
          lipo -create \
            /tmp/bs3_arm64.node \
            node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            -output node_modules/better-sqlite3/build/Release/better_sqlite3.node
          echo "→ fat binary:"
          lipo -info node_modules/better-sqlite3/build/Release/better_sqlite3.node

      - name: Build macOS universal DMG + ZIP
        # --publish always: sube al draft release independientemente de si es
        # un push de tag o de rama — soluciona el fallo histórico con onTagOrDraft
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Publicar release ─────────────────────────────────────────────────────
  publish-release:
    needs: [create-release, build-windows, build-macos]
    if: needs.create-release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar release (quitar borrador)
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
