name: Build & Release

# ──────────────────────────────────────────────────────────────────────────────
# FLUJO PERMANENTE:
#   1. Sube package.json con nueva versión a main
#   2. Este workflow se dispara automáticamente
#   3. Crea tag git + draft release en GitHub
#   4. Compila Windows (x64) y macOS (universal Intel+Apple Silicon)
#   5. Sube los artefactos al draft release
#   6. Publica el release → electron-updater lo entrega a los usuarios
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'       # solo cuando cambia la versión
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (ej: 2.2.13) — vacío = leer de package.json'
        required: false

permissions:
  contents: write

jobs:
  # ── 1. Crear tag git + draft release ────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver versión
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Crear tag git si no existe
        run: |
          VERSION="v${{ steps.ver.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION ya existe."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Tag $VERSION creado y publicado."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear draft release (idempotente)
        run: |
          VERSION="v${{ steps.ver.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $VERSION ya existe, se reutilizará."
          else
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "NeuroChat $VERSION" \
              --generate-notes \
              --draft \
            || gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "NeuroChat $VERSION" \
              --notes "Release $VERSION" \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build Windows ────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar módulos nativos para Electron (Windows x64)
        run: npx @electron/rebuild -f -w better-sqlite3,robotjs

      - name: Build Windows NSIS
        # --publish always: sube al draft release sin importar si es tag o no
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build macOS universal (Intel + Apple Silicon) ────────────────────────
  #
  # electron-builder arch:universal falla con módulos nativos en runners arm64.
  # Solución: compilar arm64 nativamente, cross-compilar x64 con CFLAGS,
  # unir con lipo, y usar npmRebuild:false para que electron-builder no
  # sobreescriba el fat binary durante el empaquetado.
  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar better-sqlite3 para arm64 (nativo)
        run: |
          npx @electron/rebuild -f -w better-sqlite3 --arch=arm64
          echo "→ arch arm64:"
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node /tmp/bs3_arm64.node

      - name: Cross-compilar better-sqlite3 para x64
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
          CFLAGS: "-arch x86_64"
          CXXFLAGS: "-arch x86_64"
          LDFLAGS: "-arch x86_64"
        run: |
          npx @electron/rebuild -f -w better-sqlite3 --arch=x64
          echo "→ arch x64:"
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node | grep -q x86_64 || \
            { echo "ERROR: cross-compile x64 falló — sigue siendo arm64"; exit 1; }

      - name: Crear fat binary universal con lipo
        run: |
          lipo -create \
            /tmp/bs3_arm64.node \
            node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            -output node_modules/better-sqlite3/build/Release/better_sqlite3.node
          echo "→ fat binary:"
          lipo -info node_modules/better-sqlite3/build/Release/better_sqlite3.node

      - name: Build macOS universal DMG + ZIP
        # --publish always: sube al draft release sin importar si es tag o no
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Publicar release ─────────────────────────────────────────────────────
  publish-release:
    needs: [create-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar release (quitar borrador)
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
