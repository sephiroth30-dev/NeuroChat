name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # releases are handled by build-release.yml
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Format · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test
