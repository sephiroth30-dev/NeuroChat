name: Release

# Triggered by version tags: git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # ── 1. Quality gate (same as CI) ────────────────────────────────────────────
  quality:
    name: Lint · Format · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  # ── 2. Build Windows installer (only if quality passes) ─────────────────────
  build-win:
    name: Build Windows installer
    needs: quality
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        # Recompiles better-sqlite3 against Electron's Node ABI
        run: npm run rebuild

      - name: Build Windows installer
        run: npm run build:win
        env:
          # Required by electron-builder to publish to GitHub releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroChat-${{ github.ref_name }}-win-x64
          path: build/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.exe
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
