appId: com.neurofit.neurochat
productName: NeuroChat
copyright: © 2025 Neurofit

directories:
  output: dist
  # Keep buildResources separate from output so electron-builder can find
  # installer-script.nsh and other build resources without conflicts.
  buildResources: build-resources

# Exclude dev-only files from the app bundle
files:
  - src/**/*
  - assets/**/*
  - "!assets/fonts/.gitkeep"

# Fonts go into the app's extra-resources folder so the renderer can load them
extraResources:
  - from: assets/fonts
    to: fonts

# Native modules must NOT be inside the asar archive
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/robotjs/**/*

publish:
  provider: github
  owner: sephiroth30-dev
  repo: NeuroChat
  releaseType: release

win:
  target: nsis
  icon: assets/icon.ico
  artifactName: NeuroChat-Setup-${version}.exe
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeuroChat
  include: installer-script.nsh

mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  icon: assets/icon.icns
  category: public.app-category.business
  artifactName: NeuroChat-${version}.${ext}
  minimumSystemVersion: '10.15.0'

dmg:
  title: NeuroChat ${version}
  window:
    width: 540
    height: 380
