appId: com.neurofit.neurochat
productName: NeuroChat
copyright: © 2025 Neurofit

directories:
  output: dist
  # Keep buildResources separate from output so electron-builder can find
  # installer-script.nsh and other build resources without conflicts.
  buildResources: build-resources

# Exclude dev-only files from the app bundle
files:
  - src/**/*
  - assets/**/*
  - "!assets/fonts/.gitkeep"

# Fonts go into the app's extra-resources folder so the renderer can load them
extraResources:
  - from: assets/fonts
    to: fonts

# Native modules (better-sqlite3) must NOT be inside the asar archive
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*

win:
  target: nsis
  icon: assets/icon.ico
  # asInvoker: app runs as the launching user; the NSIS installer handles
  # firewall rules at install time with its own elevated UAC manifest.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeuroChat
  include: installer-script.nsh
  # Path is relative to buildResources (build-resources/)

mac:
  target: dmg
  icon: assets/icon.icns
  category: public.app-category.business
  # Code signing disabled via CSC_IDENTITY_AUTO_DISCOVERY=false in CI env.
  # Internal tool: users open with right-click → Abrir on first launch.

dmg:
  title: NeuroChat ${version}
  window:
    width: 540
    height: 380
