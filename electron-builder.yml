appId: com.neurofit.neurochat
productName: NeuroChat
copyright: © 2025 Neurofit

directories:
  output: dist
  buildResources: build-resources

compression: maximum

# electron-builder no recompila módulos nativos — los compilamos
# explícitamente con @electron/rebuild en el paso de CI anterior.
npmRebuild: false

# Only include source code and the runtime assets (tray icons).
# Build-time assets (iconset PNGs, SVGs) are excluded — they're embedded
# by electron-builder into the executable/bundle and not needed at runtime.
files:
  - src/**/*
  - assets/tray-icon.ico
  - assets/tray-notify.ico
  - assets/tray-template.png
  - assets/tray-template@2x.png

# Fonts go into the app's extra-resources folder so the renderer can load them
extraResources:
  - from: assets/fonts
    to: fonts

# Keep only Spanish/English Chromium locales — drops ~45 unused locale .pak
# files from the bundle and shrinks both installer and installed footprint.
electronLanguages:
  - es
  - es-419
  - en-US

# Native modules must NOT be inside the asar archive.
# Use "/**" (not "/**/*") so root-level files like package.json are also
# unpacked — "/**/*" only matches files one subdirectory level deep.
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/robotjs/**"

publish:
  provider: github
  owner: sephiroth30-dev
  repo: NeuroChat
  releaseType: release

win:
  target: nsis
  icon: assets/icon.ico
  artifactName: NeuroChat-Setup-${version}.exe
  # asInvoker + perMachine:false = per-user install in %LOCALAPPDATA%\Programs.
  # NEVER shows UAC: installs without admin and electron-updater can replace
  # the app silently in the background. Machine-wide deployment is done via
  # GPO logon script (runs as the user) — see docs/DESPLIEGUE-GPO.md.
  requestedExecutionLevel: asInvoker

nsis:
  # Fixed GUID so Windows treats every version as the same app — enables silent
  # upgrades without leaving ghost entries in Add/Remove Programs.
  guid: "D9A7B3C2-4E1F-4A8D-9B0E-2F3C5A6D7E8F"
  oneClick: false
  allowToChangeInstallationDirectory: false
  # Per-user install: no admin rights needed to install or auto-update.
  # Old per-machine installs in C:\Program Files are removed by the GPO
  # startup script (scripts/gpo/1-limpieza-startup.bat).
  perMachine: false
  # Custom NSIS hooks (kill running instance before upgrade, firewall rules).
  # Without this line the .nsh file was never compiled into the installer.
  include: build-resources/installer-script.nsh
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeuroChat
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  icon: assets/icon.icns
  category: public.app-category.business
  artifactName: NeuroChat-${version}.${ext}
  minimumSystemVersion: '10.15.0'

dmg:
  title: NeuroChat ${version}
  window:
    width: 540
    height: 420
  contents:
    - x: 150
      y: 185
      type: file
    - x: 390
      y: 185
      type: link
      path: /Applications
    - x: 270
      y: 360
      type: file
      path: build-resources/abrir-neurochat.command
      name: "Abrir NeuroChat (primera vez).command"
