appId: com.neurofit.neurochat
productName: NeuroChat
copyright: © 2025 Neurofit

directories:
  output: build

# Exclude dev-only files from the app bundle
files:
  - src/**/*
  - assets/**/*
  - "!assets/fonts/.gitkeep"

# Fonts go into the app's extra-resources folder so the renderer can load them
extraResources:
  - from: assets/fonts
    to: fonts

# Native modules (better-sqlite3) must NOT be inside the asar archive
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*

win:
  target: nsis
  icon: assets/icon.ico
  # asInvoker: app runs as the launching user; the NSIS installer handles
  # firewall rules at install time with its own elevated UAC manifest.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeuroChat
  include: installer-script.nsh

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/icon.icns
  category: public.app-category.business
  # No code signing — internal corporate tool distributed via GitHub Releases.
  # Users on macOS 10.15+ can open with right-click → Abrir on first launch.
  identity: null

dmg:
  title: NeuroChat ${version}
  window:
    width: 540
    height: 380
