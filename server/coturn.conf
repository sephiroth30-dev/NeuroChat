# NeuroChat TURN Server Configuration (coturn)
#
# Install on Ubuntu/Debian:
#   apt update && apt install -y coturn
#   echo "TURNSERVER_ENABLED=1" >> /etc/default/coturn
#   cp server/coturn.conf /etc/turnserver.conf
#   systemctl enable coturn && systemctl start coturn
#
# Firewall rules (UFW):
#   ufw allow 3478/tcp
#   ufw allow 3478/udp
#   ufw allow 5349/tcp
#   ufw allow 5349/udp
#   ufw allow 49152:65535/udp
#   ufw allow 8765/tcp   # signaling WebSocket
#
# Generate your TURN_SECRET with:
#   openssl rand -hex 32
# Then set it here AND in your signaling server:
#   TURN_SECRET=<same-value> node server/signaling.js

# Replace with your VPS public IP
listening-ip=YOUR_VPS_PUBLIC_IP
external-ip=YOUR_VPS_PUBLIC_IP

listening-port=3478
tls-listening-port=5349

# Your domain (get a cheap domain or use your VPS IP directly)
realm=turn.your-domain.com
server-name=turn.your-domain.com

# HMAC-SHA1 shared-secret authentication (no hardcoded passwords)
use-auth-secret
static-auth-secret=YOUR_TURN_SECRET_HERE

# Relay port range (adjust if you have strict firewall rules)
min-port=49152
max-port=65535

# Logging
log-file=/var/log/coturn/coturn.log

# Performance / security
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# TLS (optional, requires Let's Encrypt cert)
# cert=/etc/letsencrypt/live/turn.your-domain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.your-domain.com/privkey.pem

# Enable verbose logging during initial testing, then remove
# verbose
