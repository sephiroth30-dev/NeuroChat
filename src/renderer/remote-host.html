<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:;"
    />
    <title>NeuroChat Remote — Host</title>
    <link rel="stylesheet" href="styles/remote.css" />
  </head>
  <body class="host-body">
    <div class="host-widget">
      <div class="host-header">
        <span class="rec-dot" id="rec-dot"></span>
        <span class="host-title" id="host-title">Capturando pantalla…</span>
      </div>
      <div class="host-peer" id="host-peer-line" style="display:none">Conectado con: <strong id="peer-name">—</strong></div>
      <div class="host-notice" id="host-notice">Si aparece un diálogo del sistema, aprueba el uso compartido de pantalla.</div>
      <div class="host-stats" id="host-stats" style="display:none">
        <span id="host-duration">0:00</span>
        &nbsp;·&nbsp;
        <span id="host-fps">— fps</span>
        &nbsp;·&nbsp;
        <span id="host-bitrate">—</span>
      </div>
      <div class="host-actions">
        <button id="hide-btn" class="hide-btn">Ocultar</button>
        <button id="end-btn" class="end-btn">Cancelar</button>
      </div>
    </div>

    <script src="remote-host.js"></script>
  </body>
</html>
